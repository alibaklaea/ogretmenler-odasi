<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a55">
<link rel="icon" href="img/ikon-192.png">
<title>Ders Tekrarı · Devreni Kendin Kur</title>
<style>
:root { --zemin: #f4f6f3; --kart: #fff; --yazi: #1f2933; --soluk: #5f6b76; --vurgu: #0b7a55; --hata: #d6336c; --cizgi: #dfe3e8; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--zemin); color: var(--yazi); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--vurgu); color: #fff; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 200px; }
header small { opacity: .85; }
header .imza { display: block; font-size: 13px; font-weight: 600; opacity: .9; margin-top: 2px; }
.ogr { background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 99px; font-size: 14px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 14px; padding: 12px 14px; }
.kart h2 { font-size: 16px; margin: 0 0 8px; }
.arac { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
button { font: inherit; cursor: pointer; border: 1px solid var(--cizgi); background: #fff; border-radius: 10px; padding: 8px 12px; color: var(--yazi); }
button:hover { border-color: var(--vurgu); }
button.secili { background: var(--vurgu); color: #fff; border-color: var(--vurgu); }
button.ana { background: var(--vurgu); color: #fff; border-color: var(--vurgu); font-weight: 700; font-size: 17px; padding: 10px 18px; }
button.ana:disabled { opacity: .5; cursor: default; }
.renk { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #adb5bd; }
.renk.secili { box-shadow: 0 0 0 3px var(--yazi); }
#ipucu { font-size: 15px; background: #fff9db; border: 1px solid #ffe066; padding: 8px 12px; border-radius: 10px; min-height: 40px; }
#sahne { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: #fbfcfd; border-radius: 12px; border: 1px solid var(--cizgi); }
pre.kod { background: #1e2a33; color: #e6edf3; font-size: 12.5px; line-height: 1.45; padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; margin: 0; }
#seri { background: #111; color: #8ce99a; font-family: Consolas, monospace; font-size: 13px; height: 90px; overflow: auto; padding: 6px 10px; border-radius: 10px; white-space: pre; }
#sonuc { font-size: 15px; }
#sonuc .hata { border-left: 5px solid var(--hata); background: #fff0f6; padding: 8px 10px; border-radius: 8px; margin: 6px 0; }
#sonuc .iyi { border-left: 5px solid #2f9e44; background: #ebfbee; padding: 8px 10px; border-radius: 8px; margin: 6px 0; }
.ilerleme { height: 10px; background: #e9ecef; border-radius: 99px; overflow: hidden; margin: 8px 0; }
.ilerleme i { display: block; height: 100%; width: 0; background: var(--vurgu); transition: width .2s; }
.gorev li { margin: 4px 0; }
.giris { max-width: 560px; margin: 40px auto; }
.giris input { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 10px; margin: 4px 0 12px; }
.belge { border: 3px dashed #2f9e44; background: #ebfbee; border-radius: 14px; padding: 14px; text-align: center; }
.belge .kodu { font-size: 30px; font-weight: 800; letter-spacing: 3px; font-family: Consolas, monospace; color: #2b8a3e; margin: 6px 0; }
.vurgu-hata { animation: hataYan 1s infinite; }
@keyframes hataYan { 50% { opacity: .25; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #212529; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 15px; z-index: 9; }
details summary { cursor: pointer; font-weight: 700; }
.adlar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.adlar button { font-size: 20px; padding: 12px 20px; min-width: 110px; }
.liste a { display: block; padding: 10px 12px; border: 1px solid var(--cizgi); border-radius: 10px; margin: 6px 0; text-decoration: none; color: inherit; background: #fff; }
</style>
</head>
<body>
<header><h1>🔌 Ders Tekrarı · Devreni Kendin Kur <small id="baslikHafta"></small><span class="imza">Öğretmenler Odası · Ali Bakla</span></h1><span class="ogr" id="ogrAd"></span></header>
<div id="kok"></div>
<script src="js/devre.js"></script>
<script src="js/kodlar.js"></script>
<script src="js/tekrar.js"></script>
</body>
</html>
